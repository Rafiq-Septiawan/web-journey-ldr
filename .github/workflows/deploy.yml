# Workflow resmi GitHub Pages untuk Vite
# Referensi: https://vitejs.dev/guide/static-deploy#github-pages
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  # Izinkan trigger manual dari Actions tab
  workflow_dispatch:

# Set permissions untuk GitHub token agar bisa deploy ke Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Hanya satu deployment aktif sekaligus
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Job 1: Build
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Install dependencies
        run: npm ci

      - name: Build with Vite
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  # Job 2: Deploy (hanya setelah build berhasil)
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
